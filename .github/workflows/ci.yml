name: churn regression checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: churn-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  model-api:
    name: model, API and lint checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@f8d944ae5831a91098ac08045d8ba3c098cac9a7 # setup-chrome-v1.7.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Train the fixture model
        run: python -m app.model --data churn.csv --output artifacts
      - name: Exercise API and model regressions
        run: python -m pytest -q
      - name: Check style
        run: ruff check app tests
      - name: Exercise local model and prediction UI in Chromium
        run: node test/browser-smoke.js
      - name: Preserve browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: churn-browser-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build deployment image (no push)
        run: docker build -t customer-churn-mlops:test .
