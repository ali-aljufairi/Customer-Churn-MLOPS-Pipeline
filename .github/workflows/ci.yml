name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m app.model --data churn.csv --output artifacts
      - run: python -m pytest -q
      - run: ruff check app tests
      - run: docker build -t customer-churn-mlops:test .
