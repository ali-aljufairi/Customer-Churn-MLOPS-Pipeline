name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Fork pull requests must not execute untrusted code on the persistent runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "linux", "x64", "customer-churn"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Create isolated Python environment
        run: |
          python -m venv "$RUNNER_TEMP/churn-venv"
          echo "$RUNNER_TEMP/churn-venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m app.model --data churn.csv --output artifacts
      - run: python -m pytest -q
      - run: ruff check app tests
      - run: docker build -t customer-churn-mlops:test .
