apiVersion: v1
kind: Namespace
metadata:
  name: customer-churn
  labels:
    app.kubernetes.io/part-of: customer-churn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-churn
  namespace: customer-churn
  labels:
    app.kubernetes.io/name: customer-churn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-churn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-churn
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/ali-aljufairi/customer-churn-mlops:f9af89972cdbb8b5b9e38b1142ec24ac5a069d4a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_DIR
              value: /app/artifacts
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer-churn
  namespace: customer-churn
spec:
  selector:
    app.kubernetes.io/name: customer-churn
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Replace the hostname placeholder before applying. TLS secret is managed by cert-manager.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: customer-churn
  namespace: customer-churn
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: cloudflare-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts: [customer-churn.aljufairi.org]
      secretName: customer-churn-tls
  rules:
    - host: customer-churn.aljufairi.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-churn
                port:
                  name: http
